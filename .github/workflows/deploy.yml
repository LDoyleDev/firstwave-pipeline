name: Deploy to Pi

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and deploy
        run: |
          cd /home/vybe/firstwave-pipeline
          git pull origin main
          venv/bin/pip install -r requirements.txt -q
          sudo cp infra/firstwave-backend.service /etc/systemd/system/firstwave-backend.service
          sudo systemctl daemon-reload
          sudo systemctl restart firstwave-backend
          echo "Deploy complete"
