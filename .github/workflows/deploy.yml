name: Deploy to Pi

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and deploy
        run: |
          cd /home/vybe/firstwave-pipeline
          git pull origin main
          venv/bin/pip install -r requirements.txt -q
          cd frontend && npm install --silent && CHOKIDAR_USEPOLLING=1 npm run build && cd ..
          sudo systemctl restart firstwave-api
          echo "Deploy complete"
